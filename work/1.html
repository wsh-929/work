<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业官网</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box; font-family: "微软雅黑";}
        body {background: #f5f5f5;}
        header {background: #fff; padding: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1);}
        .logo {font-size: 20px; font-weight: bold; color: #1677ff;}
        nav a {margin: 0 15px; text-decoration: none; color: #333;}
        .banner {height: 300px; background: #1677ff; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center;}
        .banner h1 {font-size: 36px; margin-bottom: 10px;}
        .container {width: 1200px; margin: 30px auto; display: flex; flex-wrap: wrap; gap: 20px;}
        .card {flex: 1; min-width: 250px; background: white; padding: 20px; border-radius: 8px; text-align: center;}
        .about {background: white; padding: 40px; margin: 30px 0; text-align: center;}
        footer {background: #333; color: white; text-align: center; padding: 20px; margin-top: 30px;}
    </style>
</head>
<body>
    <header>
        <div class="logo">企业LOGO</div>
        <nav>
            <a href="#">首页</a>
            <a href="#">关于我们</a>
            <a href="#">产品中心</a>
            <a href="#">联系我们</a>
        </nav>
    </header>

    <div class="banner">
        <h1>专业提供互联网解决方案</h1>
        <p>用心服务，创造价值</p>
    </div>

    <div class="container">
        <div class="card">
            <h3>产品一</h3>
            <p>企业官网建设</p>
        </div>
        <div class="card">
            <h3>产品二</h3>
            <p>小程序开发</p>
        </div>
        <div class="card">
            <h3>产品三</h3>
            <p>网页设计</p>
        </div>
        <div class="card">
            <h3>产品四</h3>
            <p>系统定制</p>
        </div>
    </div>

    <div class="about">
        <h2>关于我们</h2>
        <p>我们是一家专业的互联网服务公司，致力于为企业提供优质的网站建设、设计开发服务。</p>
    </div>

    <footer>
        版权归私人所有
    </footer>
</body>
</html>
