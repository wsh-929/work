<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报名登记页</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box; font-family: "微软雅黑";}
        body {background: #f7f8fc;}
        .hero {background: linear-gradient(135deg, #1677ff, #005ed0); color: white; text-align: center; padding: 60px 20px;}
        .hero h1 {font-size: 28px; margin-bottom: 10px;}
        .features {max-width: 1000px; margin: 40px auto; display: flex; gap: 20px; flex-wrap: wrap;}
        .feature {flex: 1; min-width: 280px; background: white; padding: 30px; border-radius: 10px; text-align: center;}
        .form-box {max-width: 500px; margin: 0 auto 50px; background: white; padding: 30px; border-radius: 10px;}
        input {width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px;}
        button {background: #1677ff; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px;}
    </style>
</head>
<body>
    <div class="hero">
        <h1>企业建站特惠活动</h1>
        <p>专业官网制作，限时优惠中</p>
    </div>

    <div class="features">
        <div class="feature">
            <h3>响应式设计</h3>
            <p>手机、电脑、平板自适应</p>
        </div>
        <div class="feature">
            <h3>快速上线</h3>
            <p>3-7天完成交付</p>
        </div>
        <div class="feature">
            <h3>售后维护</h3>
            <p>免费技术支持</p>
        </div>
    </div>

    <div class="form-box">
        <h3>立即报名</h3>
        <input type="text" placeholder="您的姓名">
        <input type="text" placeholder="联系电话">
        <a href="4.html"><button>提交申请</button></a>
    </div>
</body>
</html>
